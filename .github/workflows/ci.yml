name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: lint (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install lint dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "black>=23" "isort>=5.12" "flake8>=6" "mypy>=1.5"
      - name: Check formatting (black)
        run: black --check laker/ tests/ examples/ benchmarks/
      - name: Check import sorting (isort)
        run: isort --check-only --profile black laker/ tests/ examples/ benchmarks/
      - name: Lint with flake8
        run: |
          flake8 laker/ tests/ examples/ benchmarks/ \
            --max-line-length=100 \
            --extend-ignore=E203,W503,E501
      - name: Type check with mypy
        run: |
          pip install -e ".[dev,viz]"
          mypy laker/

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,viz]"
      - name: Lint (ruff)
        run: |
          pip install "ruff>=0.5"
          ruff check laker/ tests/ examples/ benchmarks/
      - name: Type check (mypy)
        run: mypy laker/
      - name: Run tests
        env:
          LAKER_LOG_LEVEL: INFO
        run: |
          pytest tests/ -v --tb=short \
            --cov=laker \
            --cov-branch \
            --cov-report=xml \
            --cov-fail-under=85 \
            --cov-branch-fail-under=75
      - name: Smoke import
        run: |
          python -c "from laker import Laker; import torch; \
            m = Laker(); x = torch.rand(20, 2); y = torch.randn(20); \
            m.fit(x, y); p = m.predict(x[:5]); \
            assert p.shape == (5,); print('smoke ok', p.shape)"
      - name: Upload coverage
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.13'
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          fail_ci_if_error: false

  build:
    name: wheel (${{ matrix.os }})
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Verify wheel smoke
        run: |
          pip install --force-reinstall dist/laker-*.whl
          python -c "from laker import Laker; import torch; \
            m = Laker(); x = torch.rand(20, 2); y = torch.randn(20); \
            m.fit(x, y); p = m.predict(x[:5]); \
            assert p.shape == (5,); print('wheel smoke ok')"
      - name: Twine check
        run: |
          pip install twine
          twine check dist/*

  docs:
    name: docs build
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Build docs (warnings as errors)
        run: |
          sphinx-build -W --keep-going -b html docs/ _build/html/
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: docs-html
          path: _build/html/
          retention-days: 7
