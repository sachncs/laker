name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,viz]"
      - name: Lint (ruff)
        run: |
          pip install "ruff>=0.5"
          ruff check laker/ tests/ examples/ benchmarks/
      - name: Type check (mypy)
        run: mypy laker/
      - name: Run tests
        env:
          LAKER_LOG_LEVEL: INFO
        run: |
          pytest tests/ -v --tb=short \
            --cov=laker \
            --cov-branch \
            --cov-report=xml \
            --cov-fail-under=85 \
            --cov-branch-fail-under=75
      - name: Smoke import
        run: |
          python -c "from laker import Laker; import torch; \
            m = Laker(); x = torch.rand(20, 2); y = torch.randn(20); \
            m.fit(x, y); p = m.predict(x[:5]); \
            assert p.shape == (5,); print('smoke ok', p.shape)"
      - name: Upload coverage
        if: matrix.os == 'ubuntu-latest'
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          fail_ci_if_error: false

  build:
    name: wheel (${{ matrix.os }})
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Verify wheel smoke
        run: |
          pip install --force-reinstall dist/laker-*.whl
          python -c "from laker import Laker; import torch; \
            m = Laker(); x = torch.rand(20, 2); y = torch.randn(20); \
            m.fit(x, y); p = m.predict(x[:5]); \
            assert p.shape == (5,); print('wheel smoke ok')"
      - name: Twine check
        run: |
          pip install twine
          twine check dist/*
