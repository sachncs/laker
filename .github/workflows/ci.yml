name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install lint dependencies
        run: |
          pip install black isort flake8 mypy
      - name: Check formatting (black)
        run: black --check laker/ tests/ examples/ benchmarks/
      - name: Check import sorting (isort)
        run: isort --check-only laker/ tests/ examples/ benchmarks/
      - name: Lint with flake8
        run: flake8 laker/ tests/ examples/ benchmarks/
      - name: Type check with mypy
        run: mypy laker/
      - name: One-class-per-file audit
        run: python tools/audit_one_class.py

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Python 3.13 is the highest version we claim to support in
        # pyproject.toml; every supported OS gets a 3.13 lane.
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
        exclude:
          # Windows is exercised on the latest Python only to keep
          # CI time reasonable.
          - os: windows-latest
            python-version: "3.9"
          - os: windows-latest
            python-version: "3.10"
          - os: windows-latest
            python-version: "3.11"
          - os: windows-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,viz]"
      - name: Run tests
        run: |
          pytest tests/ -v --tb=short \
            --cov=laker \
            --cov-branch \
            --cov-report=xml \
            --cov-fail-under=85 \
            --cov-branch-fail-under=75
      - name: One-class-per-file audit
        run: python tools/audit_one_class.py
      - name: Smoke import
        run: |
          python -c "from laker import Laker; import torch; \
            m = Laker(); x = torch.rand(20, 2); y = torch.randn(20); \
            m.fit(x, y); p = m.predict(x[:5]); \
            assert p.shape == (5,); print('smoke ok', p.shape)"
      - name: Upload coverage
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.13'
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          fail_ci_if_error: false
