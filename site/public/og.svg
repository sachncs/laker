<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="LAKER — Attention kernels, solved at scale.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#07080a" />
      <stop offset="100%" stop-color="#0c0c0e" />
    </linearGradient>
    <radialGradient id="aurora1" cx="0.2" cy="0.3" r="0.6">
      <stop offset="0%" stop-color="#5ee3d0" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#5ee3d0" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="aurora2" cx="0.8" cy="0.6" r="0.6">
      <stop offset="0%" stop-color="#85b7ff" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#85b7ff" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="spec" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1740" />
      <stop offset="40%" stop-color="#1a52d6" />
      <stop offset="70%" stop-color="#5ee3d0" />
      <stop offset="100%" stop-color="#f5c277" />
    </linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="40" /></filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 L0 0 L0 40" fill="none" stroke="rgba(255,255,255,0.05)" />
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)" />
  <rect width="1200" height="630" fill="url(#aurora1)" />
  <rect width="1200" height="630" fill="url(#aurora2)" />
  <rect width="1200" height="630" fill="url(#grid)" />

  <!-- Stylised spectrum map in background -->
  <g transform="translate(700,180)" opacity="0.85">
    <rect x="0" y="0" width="380" height="280" rx="22" fill="url(#spec)" opacity="0.6" />
    <g filter="url(#blur)">
      <ellipse cx="120" cy="100" rx="120" ry="80" fill="#5ee3d0" opacity="0.6" />
      <ellipse cx="260" cy="200" rx="140" ry="90" fill="#f5c277" opacity="0.55" />
      <ellipse cx="200" cy="160" rx="110" ry="70" fill="#f47b96" opacity="0.5" />
    </g>
    <rect x="0" y="0" width="380" height="280" rx="22" fill="none" stroke="rgba(255,255,255,0.12)" />
  </g>

  <!-- Title -->
  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif">
    <text x="80" y="120" font-size="22" font-weight="500" fill="#a4a8b2" letter-spacing="6">LAKER · v0.5.0</text>

    <text x="80" y="240" font-size="78" font-weight="600" fill="#f4f5f7" letter-spacing="-2.5">Attention kernels,</text>
    <text x="80" y="328" font-size="78" font-weight="400" font-style="italic" font-family="'Instrument Serif', ui-serif, Georgia, serif" fill="#f4f5f7" letter-spacing="-2.5">solved</text>
    <text x="250" y="328" font-size="78" font-weight="600" letter-spacing="-2.5">
      <tspan fill="#5ee3d0">at scale.</tspan>
    </text>

    <text x="80" y="400" font-size="26" font-weight="400" fill="#a4a8b2" letter-spacing="-0.5">A PyTorch library for regularised attention-kernel regression</text>
    <text x="80" y="436" font-size="26" font-weight="400" fill="#a4a8b2" letter-spacing="-0.5">with a learned preconditioner. Spectrum cartography at speed.</text>

    <!-- Foot chip -->
    <g transform="translate(80, 530)">
      <rect width="220" height="44" rx="22" fill="#f4f6ff" />
      <text x="110" y="28" text-anchor="middle" font-size="16" font-weight="500" fill="#06070a">pip install laker</text>
    </g>
    <g transform="translate(316, 530)">
      <rect width="240" height="44" rx="22" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.16)" />
      <text x="120" y="28" text-anchor="middle" font-size="16" font-weight="500" fill="#d6d8de">arXiv:2604.25138</text>
    </g>
  </g>
</svg>